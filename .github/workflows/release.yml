name: release

# Push a tag like v1.2.3 (or v1.2.3-rc.1 for a prerelease) to test, build every platform and publish a GitHub
# release: desktop installers (deb, rpm, AppImage, msi, setup.exe, dmg), the `ledgerhold` CLI per platform, a
# SHA256SUMS file, and a multi-arch Docker image on ghcr.io. See scripts/package.sh.
#
# Runners: always the floating "-latest" labels. GitHub has no floating label for Linux arm64, so that one names
# the newest image explicitly and needs a manual bump when a newer one appears.
#
# "Run workflow" (workflow_dispatch) does everything except publish, to dry-run the pipeline from a branch.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into the dry-run build (nothing is published)"
        default: "0.0.0-dev"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # AppImage tooling needs FUSE, which CI runners don't have.
  APPIMAGE_EXTRACT_AND_RUN: "1"

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            version="${REF_NAME#v}"
            publish=true
          else
            version="$INPUT_VERSION"
            publish=false
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not a valid version (expected e.g. 1.2.3 or 1.2.3-rc.1)"
            exit 1
          fi
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Version $version (prerelease=$prerelease, publish=$publish)"

  test:
    name: Test (${{ matrix.os }})
    timeout-minutes: 30
    needs: meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: cargo test
      - run: npm ci --prefix ui
      - run: npm --prefix ui run check
      - run: npm --prefix ui test

  build:
    name: Build (${{ matrix.rid }})
    needs: [meta, test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64,   os: ubuntu-latest,    target: "" }
          - { rid: linux-arm64, os: ubuntu-26.04-arm, target: "" }
          - { rid: osx-arm64,   os: macos-latest,     target: aarch64-apple-darwin }
          # Cross-architecture build on the arm64 runner; the binaries can't be run there, so smoke.sh skips the CLI run.
          - { rid: osx-x64,     os: macos-latest,     target: x86_64-apple-darwin }
          - { rid: win-x64,     os: windows-latest,   target: "" }
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      NAME: ledgerhold-${{ needs.meta.outputs.version }}-${{ matrix.rid }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: ${{ matrix.target }}
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            package-lock.json

      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev patchelf rpm

      - name: Package
        shell: bash
        run: scripts/package.sh "${{ matrix.rid }}" "$VERSION" dist/stage

      - name: Smoke test
        shell: bash
        run: scripts/smoke.sh dist/stage "$VERSION" "${{ matrix.rid }}"

      - name: Report the glibc floor (Linux)
        if: runner.os == 'Linux'
        run: |
          floor=$(objdump -T target/release/ledgerhold-desktop | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "- ${{ matrix.rid }} \`ledgerhold-desktop\` needs ${floor} or newer" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the macOS app's architecture
        if: runner.os == 'macOS'
        run: |
          expected=arm64
          [ "${{ matrix.rid }}" = "osx-x64" ] && expected=x86_64
          # No loose .app was found under bundle/ after `--bundles dmg`, so inspect the one inside the disk image.
          dmg=$(find "target/${{ matrix.target }}/release/bundle" -name '*.dmg' | head -1)
          [ -n "$dmg" ] || { echo "no .dmg found"; exit 1; }
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" >/dev/null
          trap 'hdiutil detach "$mnt" >/dev/null || true' EXIT
          app=$(find "$mnt" -maxdepth 1 -name '*.app' | head -1)
          [ -n "$app" ] || { echo "no .app inside $dmg"; exit 1; }
          actual=$(lipo -archs "$app/Contents/MacOS/ledgerhold-desktop")
          echo "${{ matrix.rid }}: expected $expected, app is $actual"
          [ "$actual" = "$expected" ]
          codesign --verify --strict "$app"

      # The Windows CLI is staged as a folder; zip it like the other platforms get a tarball.
      - name: Archive the CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cli = "ledgerhold-cli-$env:VERSION-${{ matrix.rid }}"
          Compress-Archive -Path "dist/stage/$cli" -DestinationPath "dist/stage/$cli.zip"
          Remove-Item -Recurse -Force "dist/stage/$cli"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}
          path: dist/stage/*
          if-no-files-found: error

  docker:
    name: Image (${{ matrix.platform }})
    needs: [meta, test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, os: ubuntu-latest,    arch: amd64 }
          - { platform: linux/arm64, os: ubuntu-26.04-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4

      - name: Build and smoke-test the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: ledgerhold:ci
      - run: scripts/smoke-docker.sh ledgerhold:ci

      - name: Log in to ghcr.io
        if: needs.meta.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each architecture is pushed by digest from its own native runner, then merged into one tag below.
      - name: Push by digest
        if: needs.meta.outputs.publish == 'true'
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.img.outputs.name }},push-by-digest=true,name-canonical=true,push=true

      - name: Record the digest
        if: needs.meta.outputs.publish == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        if: needs.meta.outputs.publish == 'true'
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error

  merge-image:
    name: Publish image tags
    needs: [meta, docker]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-arch tags
        working-directory: /tmp/digests
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags=(-t "$image:$VERSION")
          [ "$PRERELEASE" = "false" ] && tags+=(-t "$image:latest")
          docker buildx imagetools create "${tags[@]}" $(printf "$image@sha256:%s " *)
          docker buildx imagetools inspect "$image:$VERSION"

  release:
    name: Publish release
    needs: [meta, build, merge-image]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: ledgerhold-*
          merge-multiple: true
          path: dist

      - name: Checksums
        working-directory: dist
        run: sha256sum * | tee SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.meta.outputs.version }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          args=()
          [ "$PRERELEASE" = "true" ] && args+=(--prerelease)
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Ledgerhold $VERSION" \
            --generate-notes \
            "${args[@]}"
