# Self-hosted Ledgerhold:
#   docker compose up -d
#   docker compose logs ledgerhold     # shows the one-time setup code
# then open http://localhost:3000 and choose the household password. No .env file is needed.
services:
  ledgerhold:
    build: .
    image: ledgerhold:local
    container_name: ledgerhold
    restart: unless-stopped
    ports:
      - "${LEDGERHOLD_PORT:-3000}:3000"
    environment:
      # Your timezone, so "today" and month boundaries are right (e.g. America/Toronto).
      TZ: ${TZ:-UTC}
      # Optional: set the password here instead of choosing it in the browser (then the web UI can't change it).
      # LEDGERHOLD_PASSWORD: ${LEDGERHOLD_PASSWORD}
      # Behind a reverse proxy that changes the Host header, list the public address:
      # LEDGERHOLD_ALLOWED_ORIGINS: https://ledger.example.com
    volumes:
      - ledgerhold-data:/data

volumes:
  ledgerhold-data:
