[package]
name = "ledgerhold-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Self-hosted web server for Ledgerhold"

[lib]
name = "ledgerhold_server"
path = "src/lib.rs"

[[bin]]
name = "ledgerhold-server"
path = "src/main.rs"

[dependencies]
ledgerhold-app = { path = "../app" }
ledgerhold-store = { path = "../store" }
chrono = { workspace = true, features = ["clock"] }
serde.workspace = true
serde_json = "1"
anyhow = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
tower-http = { version = "0.7", features = ["fs"] }
hmac = "0.12"
sha2.workspace = true
hex.workspace = true
uuid = { version = "1", features = ["v4"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["test-util"] }
