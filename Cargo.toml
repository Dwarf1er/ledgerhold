[workspace]
resolver = "3"
members = ["crates/core", "crates/parsers", "crates/store", "crates/ofx", "crates/app", "crates/cli", "crates/server", "src-tauri"]
# Day-to-day `cargo test`/`cargo build` skip the (slow to compile) desktop shell; use `-p ledgerhold-desktop`.
default-members = ["crates/core", "crates/parsers", "crates/store", "crates/ofx", "crates/app", "crates/cli", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
ledgerhold-core = { path = "crates/core" }

# Argon2 is deliberately slow; unoptimised it makes every test that sets a password take seconds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
